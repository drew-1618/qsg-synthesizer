name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: Mypy
        run: mypy

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install -r requirements-dev.txt

      - name: Audit dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt -r requirements-dev.txt

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t qsg-synthesizer:ci .

      - name: Boot container and wait for healthz
        run: |
          docker run -d --name qsg-synthesizer -p 8000:8000 qsg-synthesizer:ci
          for i in $(seq 1 15); do
            if curl -fs http://localhost:8000/healthz; then
              echo "Container is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Container did not become healthy in time"
          exit 1

      - name: Run a comparison against the container
        run: |
          python3 - <<'PY'
          import json, urllib.request
          from pathlib import Path

          docs = Path("sample_docs")
          payload = {
              "device_a_text": (docs / "device_a_qsg.md").read_text(encoding="utf-8"),
              "device_b_text": (docs / "device_b_qsg.md").read_text(encoding="utf-8"),
          }
          req = urllib.request.Request(
              "http://localhost:8000/api/v1/compare-text",
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"},
          )
          body = json.load(urllib.request.urlopen(req, timeout=30))
          assert body["history_id"], body
          assert 1 <= body["installation_friction_score_device_a"] <= 10, body
          print("Comparison OK:", body["history_id"])
          PY

      - name: Dump container logs
        if: always()
        run: docker logs qsg-synthesizer

      - name: Stop container
        if: always()
        run: docker rm -f qsg-synthesizer
