<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QSG Synthesizer</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#2b333b" />
  <script>
    // Set the theme before first paint so there is no flash. Mirrors applyTheme() in app.js.
    (function () {
      var theme = null;
      try { theme = localStorage.getItem("qsg-theme"); } catch (e) {}
      if (theme !== "light" && theme !== "dark") {
        theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="preload" href="/static/fonts/ibm-plex-sans-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/static/fonts/archivo-latin-wdth.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/static/tailwind.css" />
</head>
<body class="min-h-screen">
  <a href="#main" class="skip-link">Skip to main content</a>

  <!-- Header -->
  <header class="bg-bezel text-bezel-ink border-b border-bezel-ink/10 sticky top-0 z-10">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center gap-3">
      <svg class="w-8 h-8 shrink-0" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="1" y="1" width="30" height="30" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-width="2" />
        <circle cx="9" cy="16" r="3" class="fill-led-green" />
        <circle cx="16" cy="16" r="3" class="fill-led-amber" />
        <circle cx="23" cy="16" r="3" class="fill-led-blue" />
      </svg>
      <div class="min-w-0">
        <h1 class="font-heading font-semibold text-lg leading-tight tracking-tight whitespace-nowrap">QSG Synthesizer</h1>
        <p class="hidden sm:block text-sm text-bezel-ink/75 leading-tight truncate">Compare two quick start guides</p>
      </div>
      <div class="ml-auto flex items-center gap-2">
        <button id="history-toggle" type="button" aria-haspopup="dialog"
                class="shrink-0 inline-flex h-10 items-center gap-2 px-3 rounded-control border border-bezel-ink/30 text-sm font-medium hover:bg-bezel-ink/10 transition-colors focus-visible:outline-bezel-ink">
          History
          <span id="history-count" class="hidden font-mono tabular-nums text-bezel-ink/75"></span>
        </button>
        <button id="theme-toggle" type="button" aria-pressed="false" aria-label="Dark theme" title="Dark theme"
                class="shrink-0 inline-flex h-10 w-10 items-center justify-center rounded-control border border-bezel-ink/30 hover:bg-bezel-ink/10 aria-pressed:bg-bezel-ink/20 transition-colors focus-visible:outline-bezel-ink">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main" class="max-w-6xl mx-auto px-4 py-8 space-y-8">

    <!-- Error banner: sticks below the header so it is seen wherever the page is scrolled -->
    <div id="error-banner" role="alert" class="hidden sticky top-20 z-10">
      <div class="flex items-start gap-3 rounded-control border border-danger bg-plate px-4 py-3 text-sm">
        <span class="led-dot led-dot--red mt-1.5" aria-hidden="true"></span>
        <p id="error-message" class="flex-1 min-w-0 break-words"></p>
        <button id="error-dismiss" type="button"
                class="shrink-0 font-medium underline underline-offset-2 rounded-control">
          Dismiss<span class="sr-only"> error</span>
        </button>
      </div>
    </div>

    <!-- Compare: choose two guides -->
    <section aria-labelledby="compare-heading" class="space-y-5">
      <h2 id="compare-heading" class="font-heading font-semibold text-xl">Add two quick start guides</h2>

      <!-- Device slots are rendered by renderDeviceSlot() in app.js -->
      <div id="device-slots" class="grid grid-cols-1 md:grid-cols-2 gap-5"></div>

      <div class="flex flex-col-reverse sm:flex-row sm:items-center sm:justify-between gap-3">
        <button id="load-samples-btn" type="button"
                class="inline-flex items-center justify-center gap-2 px-5 py-3 rounded-control border border-line bg-plate font-medium hover:bg-plate-hover disabled:text-ink-muted disabled:cursor-not-allowed transition-colors">
          Try with sample guides
        </button>
        <button id="synthesize-btn" type="button"
                class="inline-flex items-center justify-center gap-2 px-6 py-3 rounded-control bg-action hover:bg-action-hover disabled:opacity-60 disabled:cursor-not-allowed text-on-action font-semibold transition-colors">
          <span id="synthesize-spinner" class="spinner hidden"></span>
          <span id="synthesize-label">Compare devices</span>
        </button>
      </div>

      <!-- Always present so screen readers announce text written into it -->
      <div id="compare-status" role="status" class="min-h-6 text-sm text-ink-muted"></div>
    </section>

    <!-- Results: one comparative surface, rendered by renderResults() in app.js -->
    <section id="results" aria-labelledby="results-heading" class="hidden space-y-10">

      <div class="flex flex-wrap items-center justify-between gap-3">
        <h2 id="results-heading" tabindex="-1" class="font-heading font-semibold text-xl focus:outline-none">Results</h2>
        <div class="flex items-center gap-2">
          <a id="export-md-btn" href="#" aria-disabled="true" tabindex="-1"
             class="text-sm font-medium bg-plate border border-line hover:bg-plate-hover px-3.5 py-2 rounded-control transition-colors pointer-events-none opacity-40">
            Export Markdown
          </a>
          <a id="export-pdf-btn" href="#" aria-disabled="true" tabindex="-1"
             class="text-sm font-medium bg-plate border border-line hover:bg-plate-hover px-3.5 py-2 rounded-control transition-colors pointer-events-none opacity-40">
            Export PDF
          </a>
        </div>
      </div>

      <section aria-labelledby="friction-heading" class="space-y-3">
        <div>
          <h3 id="friction-heading" class="font-heading font-semibold text-lg">Installation friction</h3>
          <p class="text-sm text-ink-muted">Lower is easier to install.</p>
        </div>
        <div id="results-verdict" class="grid grid-cols-1 md:grid-cols-2 gap-5"></div>
      </section>

      <section aria-labelledby="talk-track-heading" class="space-y-3">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <h3 id="talk-track-heading" class="font-heading font-semibold text-lg">Sales talk track</h3>
          <button id="copy-btn" type="button"
                  class="text-sm font-medium bg-plate border border-line hover:bg-plate-hover px-3.5 py-2 rounded-control transition-colors">
            Copy talk track
          </button>
        </div>
        <p id="sales-talk-track" class="max-w-[65ch] text-base leading-relaxed"></p>
      </section>

      <section aria-labelledby="specs-heading" class="space-y-3">
        <h3 id="specs-heading" class="font-heading font-semibold text-lg">Side-by-side specs</h3>
        <table class="w-full table-fixed border-separate border-spacing-0 text-sm max-md:block">
          <colgroup>
            <col class="w-1/4" />
            <col />
            <col />
          </colgroup>
          <thead class="max-md:sr-only">
            <tr class="text-left">
              <th scope="col" class="sticky top-16 z-[5] bg-panel border-b border-line py-2 pr-3 font-medium text-ink-muted">Spec</th>
              <th scope="col" id="col-header-a" class="sticky top-16 z-[5] bg-panel border-b border-line py-2 pr-3 font-semibold break-words"></th>
              <th scope="col" id="col-header-b" class="sticky top-16 z-[5] bg-panel border-b border-line py-2 pr-3 font-semibold break-words"></th>
            </tr>
          </thead>
          <tbody id="comparison-table-body" class="max-md:block"></tbody>
        </table>
      </section>

      <section aria-labelledby="assessment-heading" class="space-y-3">
        <h3 id="assessment-heading" class="font-heading font-semibold text-lg">Advantages and risks</h3>
        <div id="results-assessment" class="grid grid-cols-1 md:grid-cols-2 gap-5"></div>
      </section>

      <section aria-labelledby="led-heading" class="space-y-3">
        <h3 id="led-heading" class="font-heading font-semibold text-lg">LED guide</h3>
        <div id="results-leds" class="led-panel grid grid-cols-1 md:grid-cols-2 gap-6 bg-bezel text-bezel-ink rounded-control p-5"></div>
      </section>

    </section>
  </main>

  <!-- History drawer: a native modal dialog, so focus trap, Esc and focus return come from the browser -->
  <dialog id="history-drawer" aria-labelledby="history-heading"
          class="ml-auto mr-0 my-0 h-dvh max-h-none w-full max-w-md p-0 bg-panel text-ink border-l border-line backdrop:bg-scrim overscroll-contain">
    <div class="flex h-full flex-col">
      <div class="flex items-center justify-between gap-3 px-5 py-4 border-b border-line">
        <h2 id="history-heading" class="font-heading font-semibold text-xl">History</h2>
        <button id="history-close" type="button"
                class="text-sm font-medium px-3 py-1.5 rounded-control border border-line bg-plate hover:bg-plate-hover transition-colors">
          Close
        </button>
      </div>
      <div class="px-5 py-3 border-b border-line">
        <label for="history-search" class="sr-only">Search by device name</label>
        <input id="history-search" type="search" name="history-search" autocomplete="off" spellcheck="false"
               placeholder="Search by device name…"
               class="w-full text-sm bg-plate border border-line rounded-control px-3 py-2 placeholder:text-ink-muted" />
      </div>
      <div class="flex-1 overflow-y-auto overscroll-contain px-5 py-2">
        <ul id="history-list" class="divide-y divide-line text-sm"></ul>
        <p id="history-empty" class="hidden text-sm text-ink-muted py-4"></p>
        <button id="load-more-history-btn" type="button"
                class="hidden my-3 text-sm font-medium text-action underline underline-offset-2 rounded-control">
          Load more
        </button>
      </div>
      <div class="px-5 py-3 border-t border-line">
        <button id="clear-history-btn" type="button"
                class="hidden text-sm font-medium text-ink-muted hover:text-ink underline underline-offset-2 rounded-control">
          Clear history
        </button>
      </div>
    </div>
  </dialog>

  <!-- Confirmation dialog (replaces window.confirm across the app) -->
  <dialog id="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-message"
          class="confirm-pop m-auto w-full max-w-sm p-6 bg-plate text-ink rounded-control border border-line backdrop:bg-scrim">
    <h2 id="confirm-title" class="font-heading font-semibold text-lg">Confirm action</h2>
    <p id="confirm-message" class="text-ink-muted mt-2"></p>
    <div class="flex items-center justify-end gap-2 mt-6">
      <button id="confirm-cancel-btn" type="button"
              class="font-medium px-4 py-2.5 rounded-control border border-line bg-plate hover:bg-plate-hover transition-colors">
        Cancel
      </button>
      <button id="confirm-ok-btn" type="button"
              class="font-semibold text-white bg-danger hover:bg-danger-hover px-4 py-2.5 rounded-control transition-colors">
        Confirm
      </button>
    </div>
  </dialog>

  <script src="/static/app.js"></script>
</body>
</html>
